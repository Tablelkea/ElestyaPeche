# Paramètres des cannes personnalisées.
# Le tier est stocké dans le tag PDC entier "elestyapeche:rod_tier".
default:
  weight-multiplier: 1.0
  max-uses: 100 # 0 = illimitée

# Ligne ajoutée au lore des cannes personnalisées.
# Placeholders : {uses} = utilisations restantes, {max-uses} = limite (∞ si illimitée).
lore: "&7Utilisations restantes : &f{uses}/{max-uses}"

tiers:

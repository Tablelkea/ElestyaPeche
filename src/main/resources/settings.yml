# Paramètres généraux de pêche.
# Pourcentages entre 0 et 100.
custom-fish-chance: 50
custom-fish-item: COD

# Paramètres des hameçons multi-hameçon et des logs.
fishing:
  bite-window-ticks: 60
  hook-spacing: 5.0
  hook-spacing-step: 5.0
  hook-stagger: 5.0
  debug: true

# Zone facultative de cercles de rareté, gérée avec /adminpeche tools.
fishing-tools:
  enabled: false
  zone: {}

# Probabilités de rareté parmi les poissons personnalisés.
# Via le GUI, modifier une rareté redistribue le reste proportionnellement
# aux autres raretés, afin que le total reste à 100 %.
rarity-chances:
  BASIQUE: 55
  BRILLANT: 25
  EPIQUE: 12
  LEGENDAIRE: 5
  MYSTIQUE: 3

rarity-colors:
  BASIQUE: "&7"
  BRILLANT: "&b"
  EPIQUE: "&5"
  LEGENDAIRE: "&6"
  MYSTIQUE: "&d"

# Codes couleur Minecraft (&) et placeholders : {name}, {id}, {rarity}, {weight} en kg,
# {weight_g} en grammes, {rarity_color}.
messages:
  fish-name: "&f&l{name}"
  fish-rarity: "&7Rareté : {rarity_color}&l{rarity}"
  fish-weight: "&7Poids : &f{weight_g} g"

vente:
  prix-par-kg: 10.0
  symbole: "$"
  # Valeur finale = prix de base selon la rareté + (poids x prix par kg).
  prix-de-base-par-rarete:
    basique: 5.0
    brillant: 15.0
    epique: 40.0
    legendaire: 100.0
    mystique: 250.0
  # Prix par kilogramme selon la rareté (prix-par-kg est le fallback).
  prix-par-rarete:
    basique: 8.0
    brillant: 20.0
    epique: 10.0
    legendaire: 10.0
    mystique: 10.0

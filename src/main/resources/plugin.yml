name: ElestyaPeche
version: '${version}'

main: org.elestya.plugin.ElestyaPeche
api-version: '1.21.11'
load: POSTWORLD

authors: [ TablePasDroite ]

commands:
  adminpeche:
    description: Configuration et zones de pêche
    usage: /adminpeche <config|tools|books|items>
    permission: elestyapeche.admin

permissions:
  elestyapeche.admin:
    description: Autorise la gestion de la configuration de pêche
    default: op
